model:
  default: gpt-5.6-luna-900k
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  context_length: 900000
terminal:
  backend: local
  cwd: /root/.hermes/profiles/dev
  timeout: 300
  home_mode: auto
agent:
  reasoning_effort: xhigh
  verify_on_stop: true
  verify_guidance: true
skills:
  guard_agent_created: true
  write_approval: false
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: false
checkpoints:
  enabled: true
  max_snapshots: 20
group_sessions_per_user: true
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '-1004374717222'
      name: New CEO
      thread_id: '1'
      user_id: '8564576789'
toolsets:
  - hermes-cli
_config_version: 38
onboarding:
  seen:
    profile_build_offered: true
    tool_progress_prompt: true
approvals:
  destructive_slash_confirm: false
telegram:
  require_mention: false
