model:
  default: gpt-6-astra-900k
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  context_length: 900000
terminal:
  backend: local
  cwd: /root/.hermes/profiles/reno
  timeout: 300
  home_mode: auto
agent:
  reasoning_effort: medium
  verify_on_stop: true
  verify_guidance: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  nudge_interval: 1
checkpoints:
  enabled: true
  max_snapshots: 20
group_sessions_per_user: true
skills:
  guard_agent_created: true
  write_approval: false
  creation_nudge_interval: 1
  ledger: true
toolsets:
  - memory
  - skills
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: -1003859524818
      name: Reno
      thread_id: '1'
      user_id: '8564576789'
_config_version: 41
onboarding:
  seen:
    profile_build_offered: true
    tool_progress_prompt: true
approvals:
  destructive_slash_confirm: false
telegram:
  require_mention: false
  allow_from: 8564576789
  group_allowed_chats: -1003859524818
kanban:
  dispatch_in_gateway: false
mcp_servers:
  brain:
    url: http://127.0.0.1:8765/mcp
    headers:
      Authorization: Bearer ${BRAIN_TOKEN}
      X-Hermes-Task: ${HERMES_KANBAN_TASK}
      X-Hermes-Run: ${HERMES_KANBAN_RUN_ID}
    tools:
      include:
        - conversation_recent
        - conversation_search
        - conversation_context
    resources: false
    prompts: false
  famachat:
    url: https://mcp.famachat.com.br/mcp
    headers:
      Authorization: Bearer ${FAMACHAT_MCP_KEY_RENO}
    tools:
      include:
        - fc_get_apartamentos
        - fc_get_apartamentos_empreendimento_by_id
        - fc_get_apartamentos_publico_empreendimento_by_id
        - fc_get_clientes_by_id
        - fc_get_clientes_by_id_empreendimentos
        - fc_get_clientes_by_id_notes
        - fc_get_empreendimentos
        - fc_get_empreendimentos_buscar
        - fc_get_empreendimentos_by_id
        - fc_get_empreendimentos_publico_by_id
        - fc_patch_clientes_by_id
        - fc_post_clientes_by_id_notes
    resources: false
    prompts: false
platform_toolsets:
  telegram:
    - clarify
    - no_mcp
    - terminal
    - file
    - skills
    - memory
  cli:
    - clarify
    - brain
    - famachat
    - skills
    - memory
  whatsapp:
    - clarify
    - no_mcp
    - memory
    - skills
security:
  protected_instruction_files: false
  protected_instruction_extra_patterns:
    - SKILL.md
    - profile.yaml
    - config.yaml
    - .hermes.md
mcp:
  auto_reload_on_config_change: false
plugins:
  enabled:
    - fama-learning-lifecycle
    - fama-reno-autoload
hooks:
  output_spill:
    enabled: false
auxiliary:
  background_review:
    enabled: true
