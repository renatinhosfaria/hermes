model:
  default: gpt-5.6-luna-900k
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  context_length: 900000
terminal:
  backend: local
  cwd: /root/.hermes/profiles/porteiro
  timeout: 300
  home_mode: auto
agent:
  verify_on_stop: true
  verify_guidance: true
  reasoning_effort: xhigh
  bot_mode_protocol: false
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  nudge_interval: 1
checkpoints:
  enabled: true
  max_snapshots: 20
group_sessions_per_user: true
skills:
  guard_agent_created: true
  write_approval: false
  creation_nudge_interval: 1
  ledger: true
toolsets:
  - clarify
  - skills
  - memory
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: -1004476890625
      name: Porteiro
      thread_id: '1'
      user_id: '8564576789'
_config_version: 41
onboarding:
  seen:
    profile_build_offered: true
    tool_progress_prompt: true
approvals:
  destructive_slash_confirm: false
telegram:
  require_mention: false
  allow_from:
    - '8564576789'
  group_allow_from:
    - '8564576789'
  allowed_chats: '-1004476890625'
kanban:
  dispatch_in_gateway: false
platform_toolsets:
  telegram:
    - clarify
    - no_mcp
    - terminal
    - file
    - skills
    - memory
  whatsapp:
    - clarify
    - no_mcp
    - memory
    - skills
  cli:
    - clarify
    - skills
    - memory
mcp_servers:
  brain:
    url: http://127.0.0.1:8765/mcp
    headers:
      Authorization: Bearer ${BRAIN_TOKEN}
      X-Hermes-Task: ${HERMES_KANBAN_TASK}
      X-Hermes-Run: ${HERMES_KANBAN_RUN_ID}
    tools:
      include:
        - conversation_phone
    resources: false
    prompts: false
  famachat:
    url: https://mcp.famachat.com.br/mcp
    headers:
      Authorization: Bearer ${FAMACHAT_MCP_KEY_PORTEIRO}
    tools:
      include:
        - fc_get_users
    resources: false
    prompts: false
security:
  protected_instruction_files: false
mcp:
  auto_reload_on_config_change: false
auxiliary:
  background_review:
    enabled: true
plugins:
  enabled:
    - fama-learning-lifecycle
