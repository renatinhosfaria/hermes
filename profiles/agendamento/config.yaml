model:
  default: gpt-5.6-luna-900k
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  context_length: 900000
plugins:
  enabled: []
_config_version: 41
agent:
  reasoning_effort: xhigh
  verify_on_stop: true
  verify_guidance: true
terminal:
  backend: local
  cwd: /root/.hermes/profiles/agendamento
  timeout: 300
  home_mode: auto
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
skills:
  guard_agent_created: true
  write_approval: false
  ledger: true
checkpoints:
  enabled: true
  max_snapshots: 20
group_sessions_per_user: true
toolsets:
  - skills
  - memory
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: -1003944432295
      name: Agendamento
telegram:
  require_mention: false
  allow_from: 8564576789
  group_allowed_chats: []
  allowed_chats: '-1003944432295'
kanban:
  dispatch_in_gateway: false
mcp_servers:
  famachat:
    url: https://mcp.famachat.com.br/mcp
    headers:
      Authorization: Bearer ${FAMACHAT_MCP_KEY_AGENDAMENTO}
    tools:
      include:
        - fc_get_clientes_by_id
        - fc_get_appointments
        - fc_get_appointments_by_id
        - fc_post_appointments
        - fc_patch_appointments_by_id
    resources: false
    prompts: false
platform_toolsets:
  telegram:
    - clarify
    - no_mcp
    - terminal
    - file
    - skills
    - memory
  cli:
    - clarify
    - famachat
    - skills
    - memory
  whatsapp:
    - clarify
    - no_mcp
    - skills
    - memory
security:
  protected_instruction_files: false
  protected_instruction_extra_patterns:
    - SKILL.md
    - profile.yaml
    - config.yaml
    - .hermes.md
mcp:
  auto_reload_on_config_change: false
approvals:
  destructive_slash_confirm: false
