model:
  default: gpt-5.6-luna-900k
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  reasoning_effort: xhigh
  context_length: 900000
toolsets:
  - memory
  - skills
agent:
  verify_guidance: true
  verify_on_stop: true
  reasoning_effort: xhigh
terminal:
  backend: local
  cwd: /root/.hermes/profiles/famaagent
  timeout: 300
  home_mode: auto
checkpoints:
  enabled: true
  max_snapshots: 20
mcp:
  auto_reload_on_config_change: false
auxiliary:
  background_review:
    enabled: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  nudge_interval: 1
skills:
  guard_agent_created: true
  write_approval: false
  creation_nudge_interval: 1
  ledger: true
curator:
  enabled: true
  consolidate: false
telegram:
  require_mention: false
  allow_from: 8564576789
  group_allowed_chats: -1003696068287
approvals:
  destructive_slash_confirm: false
security:
  protected_instruction_files: false
  protected_instruction_extra_patterns:
    - SKILL.md
    - profile.yaml
    - config.yaml
    - .hermes.md
kanban:
  dispatch_in_gateway: false
onboarding:
  seen:
    profile_build_offered: true
_config_version: 41
group_sessions_per_user: true
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: -1003696068287
      name: FamaAgent
      thread_id: '1'
      user_id: '8564576789'
mcp_servers:
  brain:
    url: http://127.0.0.1:8765/mcp
    headers:
      Authorization: Bearer ${BRAIN_TOKEN}
      X-Hermes-Task: ${HERMES_KANBAN_TASK}
      X-Hermes-Run: ${HERMES_KANBAN_RUN_ID}
    tools:
      include:
        - conversation_recent
        - conversation_search
    resources: false
    prompts: false
  famachat:
    url: https://mcp.famachat.com.br/mcp
    headers:
      Authorization: Bearer ${FAMACHAT_MCP_KEY_FAMAAGENT}
    tools:
      include:
        - fc_get_apartamentos
        - fc_get_apartamentos_empreendimento_by_id
        - fc_get_apartamentos_publico_empreendimento_by_id
        - fc_get_appointments_by_id
        - fc_get_clientes_by_id
        - fc_get_clientes_by_id_empreendimentos
        - fc_get_clientes_by_id_notes
        - fc_get_empreendimentos
        - fc_get_empreendimentos_buscar
        - fc_get_empreendimentos_by_id
        - fc_get_empreendimentos_publico_by_id
    resources: false
    prompts: false
platform_toolsets:
  telegram:
    - clarify
    - no_mcp
    - file
    - kanban
    - memory
    - skills
    - terminal
  cli:
    - brain
    - clarify
    - famachat
    - kanban
    - memory
    - skills
  whatsapp:
    - clarify
    - no_mcp
    - memory
    - skills
known_plugin_toolsets:
  telegram:
    - a2a
    - spotify
  cli:
    - a2a
    - spotify
known_builtin_toolsets:
  telegram:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
display:
  memory_notifications: 'on'
plugins:
  enabled:
    - fama-learning-lifecycle
