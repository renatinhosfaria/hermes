model:
  default: gpt-5.6-luna-900k
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  reasoning_effort: xhigh
  context_length: 900000
terminal:
  backend: local
  cwd: /root/.hermes/profiles/cadastro
  timeout: 300
  home_mode: auto
agent:
  verify_on_stop: true
  verify_guidance: true
  reasoning_effort: xhigh
memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: false
checkpoints:
  enabled: true
  max_snapshots: 20
group_sessions_per_user: true
skills:
  guard_agent_created: true
  write_approval: false
toolsets:
  - clarify
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: -1003746861842
      name: Cadastro
      thread_id: '1'
      user_id: '8564576789'
_config_version: 40
onboarding:
  seen:
    profile_build_offered: true
approvals:
  destructive_slash_confirm: false
telegram:
  require_mention: false
  allow_from: 8564576789
  group_allowed_chats: -1003746861842
kanban:
  dispatch_in_gateway: false
mcp_servers:
  brain:
    url: http://127.0.0.1:8765/mcp
    headers:
      Authorization: Bearer ${BRAIN_TOKEN}
      X-Hermes-Task: ${HERMES_KANBAN_TASK}
      X-Hermes-Run: ${HERMES_KANBAN_RUN_ID}
    tools:
      include:
        - conversation_phone
    resources: false
    prompts: false
  famachat:
    url: https://mcp.famachat.com.br/mcp
    headers:
      Authorization: Bearer ${FAMACHAT_MCP_KEY_CADASTRO}
    tools:
      include:
        - fc_get_clientes
        - fc_get_clientes_by_id
        - fc_post_clientes
    resources: false
    prompts: false
platform_toolsets:
  telegram:
    - clarify
    - no_mcp
  whatsapp:
    - clarify
    - no_mcp
  cli:
    - clarify
    - brain
    - famachat
security:
  protected_instruction_files: true
  protected_instruction_extra_patterns:
    - SKILL.md
    - profile.yaml
    - config.yaml
    - .hermes.md
mcp:
  auto_reload_on_config_change: false

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
