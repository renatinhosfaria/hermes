model:
  default: gpt-5.6-sol-900k
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  reasoning_effort: high
  context_length: 900000
toolsets:
  - kanban
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  verbose: false
  personalities: {}
  reasoning_effort: high
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
auxiliary:
  background_review:
    enabled: true
    provider: auto
    timeout: 120
display:
  compact: false
  busy_input_mode: queue
  bell_on_complete: false
  show_reasoning: false
  memory_notifications: verbose
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  platforms:
    whatsapp:
      tool_progress: false
      long_running_notifications: false
      interim_assistant_messages: false
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: false
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
delegation:
  max_iterations: 250
skills:
  guard_agent_created: true
  write_approval: false
  ledger: true
  creation_nudge_interval: 10
whatsapp:
  dm_policy: open
  group_policy: disabled
  session_path: /root/.hermes/platforms/whatsapp/session
  bridge_port: 3000
telegram:
  require_mention: false
  allow_from: 8564576789
approvals:
  destructive_slash_confirm: false
plugins:
  enabled:
    - brain-ceo-bridge
    - fama-whatsapp-human-handover
    - fama-kanban-channel-policy
security:
  protected_instruction_files: true
  protected_instruction_extra_patterns:
    - SKILL.md
    - profile.yaml
    - config.yaml
    - .hermes.md
kanban:
  auto_subscribe_on_create: true
  dispatch_in_gateway: true
  review_dispatch: false
  dispatch_interval_seconds: 30
  failure_limit: 2
  worker_log_rotate_bytes: 8388608
  worker_log_backup_count: 3
  orchestrator_profile: default
  default_assignee: dev
  max_in_progress: 4
  max_in_progress_per_profile: 2
  auto_decompose: false
  dispatch_stale_timeout_seconds: 3600
  max_spawn: 2
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 40
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
    - kanban
  discord:
    - hermes-discord
  whatsapp:
    - kanban
    - clarify
    - skills
    - vision
    - brain-context
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
known_plugin_toolsets:
  cli:
    - brain-context
  telegram:
    - brain-context
  whatsapp:
    - brain-context
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '-1004374717222'
      name: New CEO
      thread_id: '1'
      user_id: '8564576789'
  whatsapp:
    gateway_restart_notification: false
    extra:
      text_batch_delay_seconds: 30
      text_batch_split_delay_seconds: 30
    enabled: true
    home_channel:
      platform: whatsapp
      chat_id: 125301493366925@lid
      name: Renato Faria
      user_id: 125301493366925@lid

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
